# ---------------------------------------------------------------------------
# Assembled for totem from: shared.conf, wireless.conf, board_totem.conf
#
# Do not edit this file. Edit the pieces in universal-keymap/settings/ instead
# -- anything changed here is lost the next time it is assembled.
# ---------------------------------------------------------------------------

# Settings every keyboard gets.
# Edit here, not in the individual keyboard projects -- those files are
# assembled from this one and are overwritten each time.

CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_LOGGING=n

# Added only for keyboards used over Bluetooth: draculad, sweep, konrad, totem.
# Sleep saves the battery; the reporting settings are what put a battery
# percentage on your computer, including the half that isn't plugged in.

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# totem only.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

